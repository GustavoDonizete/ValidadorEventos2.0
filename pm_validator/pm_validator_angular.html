<style>
:root{
  --orange:#EC7000;--orange-light:#FF8C1A;--orange-dim:rgba(236,112,0,0.12);

<body>
<pm-validator></pm-validator>

<script type="module">
import { Component, signal, computed, OnInit, NgZone, ChangeDetectionStrategy } from 'https://esm.sh/@angular/core@17.3.0';
import { CommonModule, NgFor, NgIf, NgClass } from 'https://esm.sh/@angular/common@17.3.0';
import { FormsModule } from 'https://esm.sh/@angular/forms@17.3.0';
import { bootstrapApplication } from 'https://esm.sh/@angular/platform-browser@17.3.0';

// ─── Constantes ──────────────────────────────────────────────────────────────
const TYPES = ['Case_ID','Atividade','Timestamp_Inicio','Timestamp_Fim','Texto','Número','Data','Outro'];
const UNIQUE_TYPES = ['Case_ID','Atividade','Timestamp_Inicio','Timestamp_Fim'];
const PILLAR_ORDER = ['pillar1','pillar2','pillar3','pillar4','pillar5','pillar6'];
const PILLAR_WEIGHTS = {pillar1:20,pillar2:15,pillar3:20,pillar4:15,pillar5:15,pillar6:15};

function autoDetect(h) {
  const s = h.toLowerCase();
  if(/case|processo|id|chave|protocolo|numero|número/.test(s)) return 'Case_ID';
  if(/etapa|atividade|evento|activity|step|fase/.test(s))      return 'Atividade';
  if(/inicio|início|start|abertura|criado/.test(s))            return 'Timestamp_Inicio';
  if(/fim|end|fechamento|conclus|encerr/.test(s))              return 'Timestamp_Fim';
  if(/data|date/.test(s))                                       return 'Data';
  if(/tempo|time|min|seg|dur/.test(s))                        return 'Número';
  return 'Outro';
}

function scoreColor(s) {
  return s >= 80 ? 'var(--green)' : s >= 50 ? 'var(--yellow)' : 'var(--red)';
}

// ─── Componente Principal ─────────────────────────────────────────────────────
@Component({
  selector: 'pm-validator',
  standalone: true,
  imports: [CommonModule, FormsModule, NgFor, NgIf, NgClass],
  changeDetection: ChangeDetectionStrategy.Default,
  template: `
<div class="wrap">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div class="logo-mark">i</div>
      <div class="logo-text">
        <strong>Process Mining</strong>
        <span>Log Validator · Data Product</span>
      </div>
    </div>
    <div class="fw-badge"><span class="dot"></span> Angular 17</div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>Valide sua base de logs<br>para <em>Process Mining</em></h1>
    <p>Envie sua base de dados, mapeie as colunas e receba um diagnóstico completo sobre a aptidão para Process Mining — calculado por 6 pilares de qualidade.</p>
  </section>

  <!-- STEPS -->
  <div class="steps">
    <div class="step" [class.active]="currentStep===1"><div class="step-n">1</div> Enviar base</div>
    <div class="step" [class.active]="currentStep===2"><div class="step-n">2</div> Mapear colunas</div>
    <div class="step" [class.active]="currentStep===3"><div class="step-n">3</div> Rating & diagnóstico</div>
  </div>

  <!-- SERVER BAR -->
  <div class="server-bar">
    <label>Servidor Python:</label>
    <input class="server-input" [(ngModel)]="serverUrl" placeholder="http://localhost:5000"/>
    <button class="btn-sm" (click)="checkServer(true)">Verificar</button>
    <span class="status-badge" [ngClass]="serverStatusClass">{{ serverStatusText }}</span>
    <span style="font-size:11px;color:var(--text-dim);margin-left:auto">
      Execute: <code style="background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px">python pm_engine_v2.py --serve</code>
    </span>
  </div>

  <!-- STEP 1: UPLOAD -->
  <div *ngIf="currentStep===1"
    class="upload-zone"
    [class.drag]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="isDragging=false"
    (drop)="onDrop($event)"
    (click)="fileInput.click()">
    <input #fileInput type="file" accept=".csv,.xlsx,.xls,.tsv,.ods" style="display:none" (change)="onFileSelected($event)"/>
    <span class="upload-icon">📂</span>
    <h2>Arraste sua base de logs aqui</h2>
    <p>ou clique para selecionar o arquivo</p>
    <button class="btn" (click)="$event.stopPropagation(); fileInput.click()">Selecionar arquivo</button>
    <div class="upload-formats">CSV · XLSX · XLS · TSV · ODS — UTF-8, UTF-16, ANSI/CP1252, Latin-1</div>
  </div>

  <!-- STEP 2: MAPPING -->
  <div *ngIf="currentStep===2">
    <div class="file-info">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:26px">📊</span>
        <div>
          <div class="file-name">{{ fileData?.name }}</div>
          <div class="file-meta">{{ fileData?.totalRows?.toLocaleString('pt-BR') }} linhas · {{ fileData?.headers?.length }} colunas · {{ (fileData?.size/1024).toFixed(1) }} KB</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span *ngIf="fileData?.encodingUsed" class="enc-badge" [class.warn]="isEncWarn">🔤 {{ fileData.encodingUsed }}</span>
        <button class="btn-ghost" (click)="reset()">← Trocar arquivo</button>
      </div>
    </div>

    <div class="config-row">
      <div class="config-item">
        <label>Separador CSV:</label>
        <select class="cfg-select" [(ngModel)]="delimiter">
          <option value=",">, (vírgula)</option>
          <option value=";">; (ponto-vírgula)</option>
          <option value="&#9;">↹ (tab)</option>
          <option value="|">| (pipe)</option>
        </select>
      </div>
      <div class="config-item">
        <input type="checkbox" id="dayfirst" [(ngModel)]="dayfirst"/>
        <label for="dayfirst">Datas no formato DD/MM/AAAA</label>
      </div>
    </div>

    <div class="prereq-row">
      <span class="tag" [class.ok]="hasCaseId" [class.miss]="!hasCaseId">{{ hasCaseId ? '✓' : '✗' }} Case_ID</span>
      <span class="tag" [class.ok]="hasAtividade" [class.miss]="!hasAtividade">{{ hasAtividade ? '✓' : '✗' }} Atividade</span>
      <span class="tag" [class.ok]="hasTimestamp" [class.miss]="!hasTimestamp">{{ hasTimestamp ? '✓' : '✗' }} Timestamp</span>
    </div>

    <div *ngIf="duplicateTypes.length > 0" class="dup-warning">
      ⚠ Referência duplicada: <strong *ngFor="let d of duplicateTypes">{{ d }} </strong> — cada tipo só pode ser mapeado para uma coluna.
    </div>

    <div class="section-title">Mapeamento de colunas</div>
    <div class="section-sub">Identifique o tipo de cada coluna. O motor Python usará estas referências independente do nome original.</div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:30%">Coluna da base</th>
          <th style="width:26%">Tipo / Referência</th>
          <th>Descrição (opcional)</th>
        </tr></thead>
        <tbody>
          <tr *ngFor="let col of colMappings; let i = index">
            <td><span class="col-name" [title]="col.name">{{ col.name }}</span></td>
            <td>
              <select class="col-select" [(ngModel)]="col.type" [class.dup-error]="duplicateTypes.includes(col.type) && UNIQUE_TYPES.includes(col.type)" (ngModelChange)="updatePrereqs()">
                <option *ngFor="let t of TYPES" [value]="t">{{ t }}</option>
              </select>
            </td>
            <td><input class="col-input" [(ngModel)]="col.description" placeholder="Descreva esta coluna..."/></td>
          </tr>
        </tbody>
      </table>
    </div>

    <button class="btn-analyze" (click)="analyze()" [disabled]="isAnalyzing || !canAnalyze">⚙ Analisar base de dados</button>
    <div *ngIf="errorMsg" class="error-msg">⚠ {{ errorMsg }}</div>
  </div>

  <!-- LOADING -->
  <div *ngIf="isLoading" class="loading">
    <div class="spinner"></div>
    <h3>Motor Python analisando...</h3>
    <p>Executando os 6 pilares de validação</p>
    <div class="loading-steps">
      <div *ngFor="let ls of loadingSteps; let i = index" class="ls-item"
        [class.active]="loadingStep===i" [class.done]="loadingStep>i">
        {{ ls }}
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div *ngIf="result" class="result-card">

    <!-- Header -->
    <div class="result-header">
      <div style="flex:1;min-width:200px">
        <div class="rating-label" [style.color]="result.final.color">{{ result.final.label }}</div>
        <div class="rating-summary">{{ result.final.summary }}</div>
      </div>
      <div>
        <div style="font-size:10px;color:var(--text-dim);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:8px;text-align:center">Score Final</div>
        <div class="donut-wrap">
          <svg width="120" height="120" viewBox="0 0 110 110">
            <circle cx="55" cy="55" r="46" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>
            <circle cx="55" cy="55" r="46" fill="none" stroke-width="10" stroke-linecap="round"
              [attr.stroke]="result.final.color"
              [attr.stroke-dasharray]="'289 289'"
              [attr.stroke-dashoffset]="donutOffset"
              transform="rotate(-90 55 55)"
              style="transition:stroke-dashoffset 1.3s cubic-bezier(0.4,0,0.2,1)"/>
          </svg>
          <div class="donut-center">
            <span class="donut-score" [style.color]="result.final.color">{{ result.final.final_score }}</span>
            <span style="font-size:10px;color:var(--text-mid);letter-spacing:0.1em;margin-top:2px">/ 100</span>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:6px;text-align:center">todos os pilares</div>
      </div>
    </div>

    <!-- Meta -->
    <div class="result-meta">
      <div class="meta-item">📄 <strong>{{ result.input_file }}</strong></div>
      <div class="meta-item">🔢 <strong>{{ result.n_rows?.toLocaleString('pt-BR') }}</strong> linhas</div>
      <div class="meta-item">👤 <strong>{{ result.n_cases?.toLocaleString('pt-BR') }}</strong> cases</div>
      <div class="meta-item">📅 <strong>{{ result.periodo_dias }}</strong> dias</div>
      <div class="meta-item">⚡ <strong>{{ result.tempo_minutos }}</strong> min</div>
      <div class="meta-item" *ngIf="result.ts_format_inferred?.formato">
        🗓 <span class="meta-mono">{{ result.ts_format_inferred.formato }}</span>
      </div>
      <div class="meta-item" *ngIf="result.veredicto">
        <span class="meta-badge" [ngClass]="result.veredicto==='APTA'?'ok':'err'">
          {{ result.veredicto==='APTA' ? '✓ APTA' : '✗ NÃO APTA' }} (P1+P2)
        </span>
      </div>
      <div class="meta-item" *ngIf="result.risco_consultivo">
        <span class="meta-badge" [ngClass]="result.risco_consultivo==='BAIXO'?'ok':result.risco_consultivo==='MEDIO'?'warn':'err'">
          Risco {{ result.risco_consultivo }}
        </span>
      </div>
    </div>

    <!-- Ranking foco -->
    <div class="ranking-bar" *ngIf="rankingParts.length > 0">
      <span class="ranking-label">📍 Onde focar</span>
      <ng-container *ngFor="let p of rankingParts; let i = index">
        <span *ngIf="i>0" class="rank-arrow">›</span>
        <span class="rank-pill" [ngClass]="i===0?'r1':i===1?'r2':'rn'">{{ p }}</span>
      </ng-container>
    </div>

    <!-- Frase resumo -->
    <div class="frase-resumo" *ngIf="result.final.frase_resumo">{{ result.final.frase_resumo }}</div>

    <!-- Pilares breakdown -->
    <div class="pillars-section">
      <div class="section-eyebrow">Detalhamento por pilar</div>
      <div class="pillars-grid">
        <div class="pillar-card" *ngFor="let pb of sortedBreakdown">
          <div class="pc-header">
            <div class="pc-name">{{ pb.pilar }}</div>
            <span class="pc-badge" [ngClass]="isConsultivo(pb.pilar_key)?'consultivo':pb.status==='APTO'?'apto':'inapto'">
              {{ isConsultivo(pb.pilar_key) ? 'CONSULTIVO' : pb.status }}
            </span>
          </div>
          <div class="pc-score-row">
            <div class="pc-score-num" [style.color]="scoreColor(pb.score)">{{ pb.score }}</div>
            <div class="bar-track">
              <div class="bar-fill" [style.width]="pb.score+'%'" [style.background]="scoreColor(pb.score)"></div>
            </div>
            <div class="pc-weight">peso {{ getWeight(pb.pilar_key) }}%</div>
          </div>
          <div class="pc-frase" *ngIf="pb.frase_diagnostico">{{ pb.frase_diagnostico }}</div>
          <div class="subcats-list">
            <div class="sc-row" *ngFor="let sd of pb.subcategorias">
              <div class="sc-dot" [ngClass]="sd.status.toLowerCase()"></div>
              <div class="sc-name" [title]="sd.subcategoria">{{ formatSubcatName(sd.subcategoria) }}</div>
              <div class="sc-bar">
                <div class="sc-bar-fill"
                  [style.width]="(sd.score_obtido/sd.score_max*100)+'%'"
                  [style.background]="sd.status==='PASSOU'?'var(--green)':sd.status==='ZEROU'?'var(--red)':'var(--yellow)'"></div>
              </div>
              <div class="sc-score">{{ sd.score_obtido }}/{{ sd.score_max }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Gates -->
    <div class="gates-section" *ngIf="result.final.gates_triggered?.length > 0">
      <div class="eyebrow red">⛔ Gates de reprovação acionados</div>
      <div *ngFor="let g of result.final.gates_triggered" class="gate-item">
        ⛔ <strong>{{ g.pilar }}:</strong>&nbsp;{{ g.gate }}
      </div>
    </div>

    <!-- Diagnósticos -->
    <div class="result-body">
      <div class="diag-group" *ngIf="criticos.length > 0">
        <div class="diag-group-title red">❌ Problemas críticos — score zerado</div>
        <div *ngFor="let d of criticos" class="finding critico">
          <span class="finding-icon">❌</span>
          <div class="finding-body">
            <div class="finding-pilar">{{ d.pilar }}</div>
            <div class="finding-title">{{ d.check }}</div>
            <div class="finding-meta">
              <span *ngIf="d.valor" class="fv">encontrado: {{ d.valor }}</span>
              <span *ngIf="d.threshold" class="fv">limite: {{ d.threshold }}</span>
              <span *ngIf="d.impacto" class="fi critico">{{ d.impacto }}</span>
            </div>
            <div class="finding-desc">{{ d.descricao }}</div>
          </div>
        </div>
      </div>

      <div class="diag-group" *ngIf="avisos.length > 0">
        <div class="diag-group-title yellow">⚠️ Avisos — score reduzido</div>
        <div *ngFor="let d of avisos" class="finding alerta">
          <span class="finding-icon">⚠️</span>
          <div class="finding-body">
            <div class="finding-pilar">{{ d.pilar }}</div>
            <div class="finding-title">{{ d.check }}</div>
            <div class="finding-meta">
              <span *ngIf="d.valor" class="fv">encontrado: {{ d.valor }}</span>
              <span *ngIf="d.threshold" class="fv">limite: {{ d.threshold }}</span>
              <span *ngIf="d.impacto" class="fi alerta">{{ d.impacto }}</span>
            </div>
            <div class="finding-desc">{{ d.descricao }}</div>
          </div>
        </div>
      </div>

      <div class="diag-group" *ngIf="criticos.length===0 && avisos.length===0">
        <div class="diag-group-title green">✅ Nenhum problema detectado</div>
        <div class="finding ok">
          <span class="finding-icon">✅</span>
          <span>Nenhum problema encontrado em todos os 6 pilares.</span>
        </div>
      </div>

      <div class="actions">
        <button class="btn-ghost" (click)="goToMapping()">← Rever mapeamento</button>
        <button class="btn" (click)="reset()">Nova análise</button>
      </div>
    </div>

  </div><!-- /result-card -->

</div><!-- /wrap -->
  `
})
class PmValidatorComponent implements OnInit {
  TYPES = TYPES;
  UNIQUE_TYPES = UNIQUE_TYPES;

  // State
  currentStep = 1;
  serverUrl   = 'http://localhost:5000';
  serverStatusClass = 'status-badge status-checking';
  serverStatusText  = '— verificando...';
  isDragging  = false;
  isLoading   = false;
  isAnalyzing = false;
  errorMsg    = '';
  result: any = null;

  // File
  fileData: any    = null;
  rawFile: File|null = null;

  // Config
  delimiter = ',';
  dayfirst  = true;

  // Mapping
  colMappings: {name:string,type:string,description:string}[] = [];

  // Prereqs
  hasCaseId    = false;
  hasAtividade = false;
  hasTimestamp = false;
  duplicateTypes: string[] = [];
  get canAnalyze() { return this.hasCaseId && this.hasAtividade && this.hasTimestamp && this.duplicateTypes.length === 0; }

  // Loading steps
  loadingSteps = ['↗ Enviando arquivo ao servidor','🔍 Detectando encoding','⚙ Calculando Pilares 1–3','⚙ Calculando Pilares 4–6','📊 Compilando resultado'];
  loadingStep  = 0;
  private _loadingTimer: any = null;

  // Computed from result
  get donutOffset() {
    if(!this.result) return 289;
    return 289 * (1 - (this.result.final.final_score ?? 0) / 100);
  }
  get rankingParts(): string[] {
    const rk = this.result?.final?.ranking_foco || '';
    if(!rk || rk === 'Nenhum problema') return [];
    return rk.split('>').map((s:string) => s.trim()).filter(Boolean);
  }
  get sortedBreakdown(): any[] {
    const bd = this.result?.final?.pillar_breakdown || [];
    return [...bd].sort((a:any, b:any) => PILLAR_ORDER.indexOf(a.pilar_key) - PILLAR_ORDER.indexOf(b.pilar_key));
  }
  get criticos(): any[] {
    return (this.result?.final?.diagnostics || []).filter((d:any) => d.severidade === 'CRITICO');
  }
  get avisos(): any[] {
    return (this.result?.final?.diagnostics || []).filter((d:any) => ['ALERTA','WARN_FORTE','WARN'].includes(d.severidade));
  }
  get isEncWarn() {
    return this.fileData?.encodingUsed?.includes('desconhecido') || this.fileData?.encodingUsed?.includes('latin');
  }

  constructor(private ngZone: NgZone) {}

  ngOnInit() { this.checkServer(false); }

  // ── Server ──────────────────────────────────────────────────────────────────
  async checkServer(manual = false) {
    this.serverStatusClass = 'status-badge status-checking';
    this.serverStatusText  = 'verificando...';
    try {
      const r = await fetch(this.serverUrl + '/health', { signal: AbortSignal.timeout(4000) });
      this.ngZone.run(() => {
        if(r.ok) { this.serverStatusClass='status-badge status-ok'; this.serverStatusText='✓ online'; }
        else     { this.serverStatusClass='status-badge status-err'; this.serverStatusText='✗ erro '+r.status; }
      });
    } catch {
      this.ngZone.run(() => {
        this.serverStatusClass = 'status-badge status-err';
        this.serverStatusText  = manual ? '✗ offline' : '✗ offline — inicie o servidor';
      });
    }
  }

  // ── File ────────────────────────────────────────────────────────────────────
  onDragOver(e: DragEvent) { e.preventDefault(); this.isDragging = true; }
  onDrop(e: DragEvent) {
    e.preventDefault(); this.isDragging = false;
    if(e.dataTransfer?.files[0]) this.loadFile(e.dataTransfer.files[0]);
  }
  onFileSelected(e: Event) {
    const f = (e.target as HTMLInputElement).files?.[0];
    if(f) this.loadFile(f);
  }

  async loadFile(file: File) {
    this.rawFile = file;
    const ext = file.name.split('.').pop()?.toLowerCase() || '';
    if(['xlsx','xls','ods'].includes(ext)) { this.loadFileSheetJS(file); return; }
    try {
      this.serverStatusClass = 'status-badge status-checking';
      this.serverStatusText  = 'lendo colunas...';
      const fd = new FormData();
      fd.append('file', file);
      fd.append('config', JSON.stringify({ delimiter: this.delimiter }));
      const resp = await fetch(this.serverUrl + '/columns', { method:'POST', body:fd, signal:AbortSignal.timeout(10000) });
      if(resp.ok) {
        const data = await resp.json();
        this.ngZone.run(() => {
          this.serverStatusClass = 'status-badge status-ok'; this.serverStatusText = '✓ online';
          this.fileData = { name:file.name, size:file.size, headers:data.columns, totalRows:data.n_rows,
                            encodingUsed:data.encoding_used, delimiterDetected:data.delimiter_detected };
          if(data.delimiter_detected && {';':1,',':1,'\t':1,'|':1}[data.delimiter_detected])
            this.delimiter = data.delimiter_detected;
          this.buildMappings();
          this.currentStep = 2;
        });
        return;
      }
    } catch {
      this.ngZone.run(() => { this.serverStatusClass='status-badge status-err'; this.serverStatusText='✗ offline'; });
    }
    this.loadFileSheetJS(file, true);
  }

  loadFileSheetJS(file: File, isFallback = false) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = (window as any).XLSX.read(new Uint8Array(e.target!.result as ArrayBuffer), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const json = (window as any).XLSX.utils.sheet_to_json(ws, {header:1});
        const headers = ((json[0]||[]) as any[]).map(String);
        this.ngZone.run(() => {
          this.fileData = { name:file.name, size:file.size, headers, totalRows:json.slice(1).length,
                            encodingUsed: isFallback ? 'desconhecido (servidor offline)' : null };
          this.buildMappings();
          this.currentStep = 2;
        });
      } catch(err:any) { this.ngZone.run(()=>this.errorMsg='Erro ao ler arquivo: '+err.message); }
    };
    reader.readAsArrayBuffer(file);
  }

  buildMappings() {
    this.colMappings = (this.fileData?.headers || []).map((h:string) => ({
      name: h, type: autoDetect(h), description: ''
    }));
    this.updatePrereqs();
  }

  updatePrereqs() {
    const types = this.colMappings.map(c => c.type);
    this.hasCaseId    = types.includes('Case_ID');
    this.hasAtividade = types.includes('Atividade');
    this.hasTimestamp = types.includes('Timestamp_Inicio');
    const counts: Record<string,number> = {};
    types.forEach(t => { if(UNIQUE_TYPES.includes(t)) counts[t] = (counts[t]||0)+1; });
    this.duplicateTypes = Object.entries(counts).filter(([,n])=>n>1).map(([t])=>t);
  }

  // ── Analyze ─────────────────────────────────────────────────────────────────
  async analyze() {
    if(!this.canAnalyze || this.isAnalyzing) return;
    this.errorMsg = '';
    this.result   = null;
    this.isLoading = true;
    this.isAnalyzing = true;
    this.currentStep = 3;
    this.startLoadingAnim();
    try {
      const caseMap  = this.colMappings.find(m=>m.type==='Case_ID');
      const actMap   = this.colMappings.find(m=>m.type==='Atividade');
      const startMap = this.colMappings.find(m=>m.type==='Timestamp_Inicio');
      const endMap   = this.colMappings.find(m=>m.type==='Timestamp_Fim');
      const fd = new FormData();
      fd.append('file', this.rawFile!);
      fd.append('mapping', JSON.stringify({ case_id:caseMap!.name, activity:actMap!.name,
        timestamp_inicio:startMap!.name, timestamp_fim:endMap?.name||null }));
      fd.append('config', JSON.stringify({ delimiter:this.delimiter, dayfirst:this.dayfirst }));
      const ctrl = new AbortController();
      const tid = setTimeout(()=>ctrl.abort(), 300000);
      const resp = await fetch(this.serverUrl+'/analyze', { method:'POST', body:fd, signal:ctrl.signal });
      clearTimeout(tid);
      if(!resp.ok) {
        const err = await resp.json().catch(()=>({error:'Erro '+resp.status}));
        throw new Error(err.error||'Erro '+resp.status);
      }
      const data = await resp.json();
      this.ngZone.run(() => { this.result = data; });
    } catch(err:any) {
      this.ngZone.run(() => {
        this.currentStep = 2;
        this.errorMsg = err.name==='AbortError'
          ? 'Tempo limite excedido (5 min).'
          : 'Erro ao conectar: '+err.message+'. Verifique se o motor está rodando.';
      });
    } finally {
      this.ngZone.run(() => { this.stopLoadingAnim(); this.isLoading=false; this.isAnalyzing=false; });
    }
  }

  startLoadingAnim() {
    this.loadingStep = 0;
    this._loadingTimer = setInterval(() => {
      this.ngZone.run(() => { if(this.loadingStep < this.loadingSteps.length-1) this.loadingStep++; });
    }, 1800);
  }
  stopLoadingAnim() {
    if(this._loadingTimer) { clearInterval(this._loadingTimer); this._loadingTimer=null; }
    this.loadingStep = this.loadingSteps.length;
  }

  // ── Helpers template ────────────────────────────────────────────────────────
  scoreColor(s: number) { return scoreColor(s); }
  isConsultivo(k: string) { return !['pillar1','pillar2'].includes(k); }
  getWeight(k: string) { return PILLAR_WEIGHTS[k as keyof typeof PILLAR_WEIGHTS] || 0; }
  formatSubcatName(s: string) { return s.replace(/^\d+\.\d+_/,'').replace(/_/g,' '); }

  goToMapping() { this.currentStep = 2; this.result = null; }
  reset() {
    this.currentStep = 1; this.result = null; this.fileData = null;
    this.rawFile = null; this.colMappings = []; this.errorMsg = '';
    this.hasCaseId = this.hasAtividade = this.hasTimestamp = false;
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
bootstrapApplication(PmValidatorComponent).catch(err => console.error(err));
</script>
